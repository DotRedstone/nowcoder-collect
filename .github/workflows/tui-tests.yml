name: TUI tests
on:
  push:
    branches: [refactor/review-workspace]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI dependencies
        run: python -m pip install -r requirements-tui.txt
      - name: Check syntax
        run: python -m compileall -q review_tui.py tui_backend.py detector
      - name: Run data layer tests
        run: python -m unittest discover -s tests -v
      - name: Run detector regression tests
        run: python -m unittest discover -s detector/tests -v
